[package]
name = "fm27-chronicle"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"
description = "FM27 Chronicle: season review and career history for Football Manager 27, read live from the game"

[[bin]]
name = "fm27-chronicle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui-phosphor = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
# op Windows leest de app fm.exe van buitenaf met dezelfde code als de module
fm27-agent = { path = "../agent" }

[build-dependencies]
winresource = "0.1"
